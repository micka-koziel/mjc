    <path d="M47.8 52.2a1.6 1.6 0 1 0 1.8 1.2" stroke="#C9B8A8" stroke-width="1" fill="none"/>
    <path d="M43.5 56.2c3-1.2 6-1.2 9 .2-3 1.4-6 1.4-9-.2z" fill="#5E1F1C"/>
    <!-- oreille : anneaux et clou -->
    <circle cx="62.5" cy="51" r="2.6" fill="none" stroke="#C9B8A8" stroke-width="1.2"/>
    <circle cx="62.8" cy="46.5" r=".9" fill="#C9B8A8"/>
    <!-- badge épinglé : brin vert -->
    <circle cx="23" cy="83" r="5.5" fill="#338811" stroke="#0E0806" stroke-width="1"/>
    <path d="M21 85.5c1-3 3-4.5 5-5.5" stroke="#E8F3E1" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <ellipse cx="24.8" cy="81.6" rx="1.9" ry=".9" transform="rotate(-35 24.8 81.6)" fill="#E8F3E1"/>
    <!-- grain grunge -->
    <rect width="96" height="96" fill="#000" filter="url(#grain)" opacity=".45"/>
  </g>
