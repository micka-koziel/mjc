    <path d="M42 56h12v14c-4 2-8 2-12 0z" fill="#D9A383"/>
    <path d="M41.5 63.5c4 2 9 2 13 0" stroke="#0E0806" stroke-width="2.2" fill="none"/>
    <circle cx="48" cy="66.3" r="1.2" fill="#C9B8A8"/>
