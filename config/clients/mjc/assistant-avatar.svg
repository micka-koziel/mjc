    <path d="M30 46c-1-12 5-24 18-26 11-1 18 6 19 18l-4-3-3 6-2-8-4 7-3-9-4 8-3-7-4 9-2-4z" fill="#24120B"/>
    <path d="M44 20c-3 6-4 12-3 18l2-8z" fill="#AD7C59"/>
    <path d="M58 24c2 5 3 10 2 15l-2-7z" fill="#AD7C59" opacity=".8"/>
    <!-- regard charbonneux -->
    <path d="M37 44.5c2.5-2.6 6-2.6 8.4 0-2.5 1.8-5.9 1.8-8.4 0z" fill="#F4ECE6"/>
    <path d="M50.6 44.5c2.5-2.6 6-2.6 8.4 0-2.5 1.8-5.9 1.8-8.4 0z" fill="#F4ECE6"/>
    <circle cx="41.2" cy="44.3" r="1.8" fill="#2C160C"/>
    <circle cx="54.8" cy="44.3" r="1.8" fill="#2C160C"/>
    <circle cx="41.7" cy="43.7" r=".5" fill="#FFF"/><circle cx="55.3" cy="43.7" r=".5" fill="#FFF"/>
    <path d="M36 44.5c2.8-3.6 7.6-3.6 10 0M50 44.5c2.4-3.6 7.2-3.6 10 0" stroke="#0E0806" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M36.5 45.8c2.5 2 6 2.2 9 .8M50.5 46.6c3 1.4 6.5 1.2 9-.8" stroke="#4A2A22" stroke-width="1.1" fill="none" opacity=".8"/>
    <path d="M45.6 44.2l2-1.6M60 44.2l-2-1.6" stroke="#0E0806" stroke-width="1.4" stroke-linecap="round"/>
