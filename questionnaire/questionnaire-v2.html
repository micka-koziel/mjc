</style></head><body><div class="app"><aside class="rail"><div class="logo">KHentik <small>Email · Configuration</small></div><div><h1>Une messagerie à votre image.</h1><p>Quelques choix pour ajuster l'interface et les réponses de votre assistant.</p></div><div class="railsteps" id="railsteps"></div><div class="rail-bottom">Les données restent sur cet appareil jusqu'à leur export.<br><br><button class="modechange" id="restart" type="button">Changer de parcours</button></div></aside><main class="main"><div class="top"><div class="eyebrow" id="eyebrow">Configuration client</div><div class="hintpill" id="modepill">KHentik Email</div></div><div class="mobileprogress" id="mobileprogress"><div class="progress-track"><div class="progress-fill" id="progressfill"></div></div><div class="stepshint" id="stepshint"></div></div><div class="content" id="content"></div></main></div><footer class="footer" id="footer"><div class="footerinner"><button class="btn" id="back">Précédent</button><span class="status" id="status" aria-live="polite"></span><button class="btn primary" id="next">Continuer</button></div></footer>
<script>
(function(){'use strict';
const KEY='khentik.email.configuration.v2';const MAX_FILE=2*1024*1024,MAX_TOTAL=8*1024*1024;const steps=[['identity','Votre entreprise'],['brand','Identité visuelle'],['interface','Interface'],['assistant','Assistant IA'],['review','Validation']];
const defaults={schemaVersion:'1.0',questionnaireVersion:'2.0',mode:null,client:{companyName:'',productName:'',website:'',isFictional:false},brand:{logo:{light:null,dark:null},colors:{useKHentikDefaults:true,primary:'#A9883A',accent:'#0C1929'},extra:{secondary:'#486078',surface:'#F6F7F9',links:'#A9883A',brandWords:'',referenceUrl:'',style:'balanced'}},appearance:{theme:'light',font:'system',density:'comfortable',textSize:'normal',layout:'balanced',messagePreview:'two',sidebar:'expanded',corners:'soft',contrast:'standard'},assistant:{name:'Assistant',tone:'cordial',concision:'balanced',language:'fr',formality:'vous',greeting:'contextual',signature:'none',signatureText:'',responseApproach:'draft',empathy:'balanced',clarify:'ask',avoidPromises:true,forbiddenTerms:'',exampleResponse:'',instructions:''},context:{applied:false,activity:'',emailTypes:[],priorityExpectations:'',importantSenders:'',notes:'',businessDescription:'',audience:'',vocabulary:'',priorityRules:'',escalationRules:'',exampleEmails:''},feedback:{identity:'',brand:'',interface:'',assistant:'',review:''},documents:[],meta:{exportedAt:null,source:'questionnaire-v2',scope:'UX/UI and assistant configuration',applicationCompatibility:'Existing core supports only the v1 subset. Additional values require implementation.'}};
function clone(o){return JSON.parse(JSON.stringify(o))}function merge(base,other){if(Array.isArray(base))return Array.isArray(other)?other:base;if(base&&typeof base==='object'){let r={...base};for(const k in base)r[k]=merge(base[k],other&&other[k]);return r}return other===undefined?base:other}let state=defaults;try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);state=merge(defaults,s)}}catch(e){}let page=state.mode?'identity':'mode',err={};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const get=p=>p.split('.').reduce((o,k)=>o?.[k],state);function set(p,v){const ks=p.split('.');let o=state;while(ks.length>1)o=o[ks.shift()];o[ks[0]]=v;save()}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#status').textContent='Enregistré sur cet appareil'}catch(e){$('#status').textContent='Stockage plein : exportez votre configuration'}}function label(p,t,h=''){return `<label for="${p.replaceAll('.','-')}">${esc(t)}</label>${h?`<small>${esc(h)}</small>`:''}`}function field(path,title,opts={}){const id=path.replaceAll('.','-'),value=esc(get(path)),ph=esc(opts.placeholder||'');return `<div class="field"><label for="${id}">${esc(title)}${opts.required?' *':''}</label>${opts.type==='textarea'?`<textarea id="${id}" data-path="${path}" maxlength="${opts.max||2000}" placeholder="${ph}">${value}</textarea>`:`<input id="${id}" data-path="${path}" type="${opts.type||'text'}" maxlength="${opts.max||200}" value="${value}" placeholder="${ph}">`}${opts.hint?`<small>${esc(opts.hint)}</small>`:''}${err[path]?`<div class="error">${esc(err[path])}</div>`:''}</div>`}function choice(path,options,columns=''){return `<div class="choices ${columns}">${options.map(([v,t,d])=>`<button class="choice ${get(path)===v?'selected':''}" type="button" data-choice="${path}" data-value="${v}" aria-pressed="${get(path)===v}"><strong>${esc(t)}</strong><span>${esc(d||'')}</span></button>`).join('')}</div>`}function comments(id){return `<details class="comment" ${get('feedback.'+id)?'open':''}><summary>Ajouter une précision ou une demande particulière</summary><textarea data-path="feedback.${id}" placeholder="Votre commentaire pour cette étape…">${esc(get('feedback.'+id))}</textarea></details>`}function advanced(html){return state.mode==='detailed'?`<div class="advanced"><div class="adv-title">Paramètres approfondis</div>${html}</div>`:''}function panel(title,desc,body){return `<section class="panel"><h3 class="section-title">${title}</h3>${desc?`<p class="sub">${desc}</p>`:''}${body}</section>`}function pageHead(t,d){return `<div class="heading"><h2>${t}</h2><p>${d}</p></div>`}function fileField(id,labelText,accept,multiple=true){return `<div class="field"><label>${labelText}</label><div class="fileline"><label class="filebtn" for="${id}">Choisir ${multiple?'des fichiers':'un fichier'}<input type="file" id="${id}" data-upload="${id}" ${multiple?'multiple':''} accept="${accept}"></label><span class="fileinfo">2 Mo / fichier · 8 Mo au total · intégré à l'export</span></div></div>`}
function identity(){return pageHead('Votre entreprise','Les éléments qui identifieront votre messagerie.')+`<div class="cols"><div>${panel('Identité', '',field('client.companyName','Nom de l’entreprise',{required:true,placeholder:'Ex. Maison Martin'})+field('client.productName','Nom affiché dans l’application',{required:true,placeholder:'Ex. Maison Martin Mail'})+field('client.website','Site internet',{type:'url',placeholder:'https://www.exemple.fr'}))}${panel('Votre logo','Utilisé dans la messagerie. Aucun logo n’est obligatoire.',fileField('light','Logo principal','image/png,image/jpeg,image/webp,image/svg+xml',false)+renderLogos('light')+fileField('dark','Variante pour fond sombre (facultatif)','image/png,image/jpeg,image/webp,image/svg+xml',false)+renderLogos('dark')+advanced(field('brand.extra.brandWords','Trois mots qui décrivent votre marque',{placeholder:'Ex. artisanal, sobre, chaleureux'})+field('brand.extra.referenceUrl','Site de référence visuelle',{type:'url',placeholder:'https://…'}))+comments('identity'))}</div>${preview()}</div>`}
function renderLogos(which){const x=get('brand.logo.'+which);return x?`<div class="fileitem">${esc(x.fileName||'Logo ajouté')} <button type="button" data-remove-logo="${which}">Retirer</button></div>`:''}
const presets=[['KHentik','#A9883A','#0C1929'],['Bleu & or','#26578D','#DAA537'],['Vert','#197263','#A3BC77'],['Terracotta','#A15337','#E4B789'],['Prune','#814466','#E7B5C9'],['Carbone','#283344','#B5A88F']];
function colorInput(path,title){let v=get(path);return `<div class="field"><label>${esc(title)}</label><div class="colorrow"><input type="color" data-color="${path}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#888888'}" aria-label="${esc(title)}"><input type="text" data-path="${path}" value="${esc(v)}" maxlength="7" aria-label="Code hexadécimal ${esc(title)}"></div>${err[path]?`<div class="error">${esc(err[path])}</div>`:''}</div>`}
function brand(){return pageHead('Votre identité visuelle','Choisissez une ambiance. Le résultat apparaît immédiatement à droite.')+`<div class="cols"><div>${panel('Palette principale','Une base prête à l’emploi ou vos couleurs exactes.',`<div class="choices">${presets.map((p,i)=>`<button type="button" class="choice ${state.brand.colors.primary===p[1]&&state.brand.colors.accent===p[2]?'selected':''}" data-preset="${i}"><div class="swatches"><span style="background:${p[1]}"></span><span style="background:${p[2]}"></span></div><strong>${p[0]}</strong></button>`).join('')}</div><div class="grid2">${colorInput('brand.colors.primary','Couleur principale')}${colorInput('brand.colors.accent','Couleur d’accent')}</div>`+advanced(`<div class="grid2">${colorInput('brand.extra.secondary','Couleur secondaire')}${colorInput('brand.extra.links','Liens et actions secondaires')}${colorInput('brand.extra.surface','Fond principal souhaité')}</div><div class="field"><label>Style de marque</label>${choice('brand.extra.style',[['balanced','Équilibré','Sobre et universel'],['minimal','Minimal','Très épuré'],['expressive','Affirmé','Identité visuelle marquée']])}</div><div class="note">Les couleurs supplémentaires sont enregistrées comme préférences. Leur application dans le core dépendra des variables de thème implémentées par Alexandre.</div>`)+comments('brand'))}</div>${preview()}</div>`}
function interfaceStep(){return pageHead('Votre interface','Réglez le confort et l’apparence de votre messagerie.')+`<div class="cols"><div>${panel('Ambiance générale','',`<div class="field"><label>Thème</label>${choice('appearance.theme',[['light','Clair','Fond lumineux'],['dark','Sombre','Fond foncé'],['system','Automatique','Selon l’appareil']],'three')}</div><div class="field"><label>Confort de lecture</label>${choice('appearance.density',[['comfortable','Aéré','Plus d’espace'],['compact','Compact','Plus de messages visibles']])}</div><div class="field"><label>Taille du texte</label>${choice('appearance.textSize',[['normal','Standard','Taille habituelle'],['large','Grande','Lecture facilitée']])}</div>`+advanced(`<div class="field"><label>Style typographique</label>${choice('appearance.font',[['system','Moderne','Neutre et lisible'],['humanist','Douce','Plus chaleureuse'],['serif','Classique','Avec empattements']],'three')}</div><div class="field"><label>Organisation de l’écran</label>${choice('appearance.layout',[['balanced','Équilibrée','Liste et lecture'],['list','Liste dominante','Priorité à la boîte de réception'],['focus','Concentration','Lecture d’un message à la fois']])}</div><div class="field"><label>Aperçu des messages</label>${choice('appearance.messagePreview',[['one','Une ligne','Lecture rapide'],['two','Deux lignes','Plus de contexte'],['none','Masqué','Présentation épurée']])}</div><div class="field"><label>Navigation latérale</label>${choice('appearance.sidebar',[['expanded','Ouverte','Tout est visible'],['collapsed','Réduite','Plus d’espace utile']])}</div><div class="field"><label>Style des angles</label>${choice('appearance.corners',[['soft','Arrondis','Contemporain'],['square','Discrets','Plus institutionnel']])}</div><div class="field"><label>Contraste</label>${choice('appearance.contrast',[['standard','Standard','Équilibré'],['high','Renforcé','Pour une meilleure lecture']])}</div><div class="note">Les options avancées d’organisation et de
