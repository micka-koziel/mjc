# Netlify — instance de démonstration Mon jardin chocolaté.
# Application construite en fichiers statiques (dossier out/) : les données
# passent par Firebase et les fonctions serveur. Les clés Web Firebase
# (NEXT_PUBLIC_FIREBASE_*, publiques par conception) sont saisies dans les
# variables d'environnement du site Netlify, pas ici.
[build]
  command = "npm run build:netlify"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Le scanner de secrets prend les clés Web Firebase pour des fuites : on
  # les lui signale explicitement (ne jamais désactiver le scanner en entier).
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_FUNCTIONS_BASE_URL"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
